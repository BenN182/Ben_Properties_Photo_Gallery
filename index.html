<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📸 Gallery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b1a26;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; color: #e7f1f9; padding: 1.5rem;
    }
    .gallery-container {
      max-width: 1200px; width: 100%;
      display: flex; flex-direction: column; align-items: center; gap: 1.2rem;
    }
    .gallery-header { text-align: center; padding: 0.5rem 0 0.2rem; }
    .gallery-header h1 {
      font-weight: 400; font-size: 1.6rem; color: #a6cee3;
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
    }
    .folder-badge {
      background: #1e6f9f; color: white; padding: 0.2rem 0.9rem;
      border-radius: 40px; font-size: 1.2rem; font-weight: 500;
    }
    .viewer {
      position: relative; width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .image-stage {
      position: relative; flex: 1; background: #112433; border-radius: 24px;
      overflow: hidden; box-shadow: 0 25px 45px -12px rgba(0,0,0,0.7), 0 0 0 1px #1f3c50;
      display: flex; align-items: center; justify-content: center;
      min-height: 55vh; max-height: 75vh; aspect-ratio: 16/10;
    }
    .image-stage img {
      width: 100%; height: 100%; object-fit: contain; display: block; background: #0b1a26;
    }
    .nav-arrow {
      background: rgba(20,50,70,0.8); backdrop-filter: blur(6px);
      border: 1px solid #2d5c7a; color: #e0f0ff;
      width: 58px; height: 58px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; cursor: pointer; user-select: none;
      transition: all 0.2s ease; flex-shrink: 0; padding-bottom: 4px;
    }
    .nav-arrow:hover:not(:disabled) { background: #1e6f9f; transform: scale(1.05); }
    .nav-arrow:disabled { opacity: 0.2; cursor: not-allowed; }
    .image-counter {
      font-size: 1rem; color: #8bb5d0; background: #0e1e2b;
      padding: 0.5rem 1.6rem; border-radius: 50px; border: 1px solid #1d3c51;
    }
    .status-message {
      text-align: center; padding: 3rem 2rem; background: #0e1e2b;
      border-radius: 28px; width: 100%; font-size: 1.1rem; color: #b3d6ef;
      border: 1px solid #1f3c50; display: flex; flex-direction: column;
      align-items: center; gap: 0.8rem;
    }
    .status-message i { font-style: normal; font-size: 2.5rem; line-height: 1; }
    .status-message.error { background: #2a1b1a; color: #f4b9b0; border-color: #663a35; }
    .footer-note { font-size: 0.8rem; color: #5c7f97; text-align: center; margin-top: 0.5rem; }
    .hidden { display: none !important; }
    @media (max-width: 700px) {
      .nav-arrow { width: 44px; height: 44px; font-size: 1.6rem; }
      .image-stage { min-height: 40vh; border-radius: 18px; }
    }
  </style>
</head>
<body>
  <div class="gallery-container">
    <div class="gallery-header">
      <h1><span>📁 Folder</span> <span class="folder-badge" id="folderBadge">…</span></h1>
    </div>

    <div class="viewer hidden" id="viewer">
      <button class="nav-arrow" id="prevBtn" aria-label="Previous" disabled>‹</button>
      <div class="image-stage" id="imageStage"></div>
      <button class="nav-arrow" id="nextBtn" aria-label="Next" disabled>›</button>
    </div>

    <div class="image-counter hidden" id="imageCounter">Loading…</div>
    <div class="footer-note" id="footerNote"></div>

    <div class="status-message" id="statusMessage">
      <i>⏳</i>
      <div>Loading…</div>
    </div>
  </div>

  <script>
    (function() {
      // ============================================================
      // CONFIG
      // ============================================================
      // IMPORTANT: adjust the base path if your repo name changes.
      // This is auto-detected from the current URL, so no change needed.
      
      const IMAGE_EXTENSIONS = ['jpg', 'jpeg', 'png', 'gif', 'webp'];
      const MAX_IMAGES = 100;

      // Filename patterns to try. Adjust these to match your actual files!
      // Each function receives a number and returns a base name (no extension).
      const PATTERNS = [
        (n) => `${n}`,                        // 1, 2, 3
        (n) => `${String(n).padStart(2, '0')}`, // 01, 02, 03
        (n) => `image${n}`,
        (n) => `img${n}`,
        (n) => `photo${n}`,
        (n) => `pic${n}`,
      ];

      // ============================================================
      // DOM
      // ============================================================
      const folderBadge = document.getElementById('folderBadge');
      const viewer = document.getElementById('viewer');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const imageStage = document.getElementById('imageStage');
      const imageCounter = document.getElementById('imageCounter');
      const footerNote = document.getElementById('footerNote');
      const statusMessage = document.getElementById('statusMessage');

      let imagePaths = [];
      let currentIndex = 0;

      // ============================================================
      // Detect repo base path — works both for github.io/Repo/... and localhost
      // ============================================================
      function getBasePath() {
        // e.g. "/Ben_Properties_Photo_Gallery"
        const path = window.location.pathname;
        // Strip trailing slash
        const clean = path.replace(/\/$/, '');
        // If last segment is a number (folder id), strip it
        const parts = clean.split('/').filter(Boolean);
        if (parts.length && /^\d+$/.test(parts[parts.length - 1])) {
          parts.pop();
        }
        return '/' + parts.join('/');
      }

      // ============================================================
      // Get folder from URL — supports both /1 and ?folder=1
      // ============================================================
      function getFolder() {
        // Query string: ?folder=1
        const params = new URLSearchParams(window.location.search);
        const q = params.get('folder');
        if (q && /^\d+$/.test(q)) return q;

        // Path segment: /1
        const parts = window.location.pathname.split('/').filter(Boolean);
        const last = parts[parts.length - 1];
        if (last && /^\d+$/.test(last)) return last;

        return '1';
      }

      // ============================================================
      // Check image exists using fetch HEAD (more reliable than Image())
      // ============================================================
      async function imageExists(url) {
        try {
          const res = await fetch(url, { method: 'HEAD', cache: 'no-store' });
          return res.ok;
        } catch (e) {
          return false;
        }
      }

      // ============================================================
      // Scan folder for images
      // ============================================================
      async function scanFolder(folder, basePath) {
        const folderPath = `${basePath}/${folder}`;
        const found = [];

        for (let i = 1; i <= MAX_IMAGES; i++) {
          let foundThisNumber = false;

          for (const patternFn of PATTERNS) {
            const base = patternFn(i);
            for (const ext of IMAGE_EXTENSIONS) {
              const url = `${folderPath}/${base}.${ext}`;
              if (await imageExists(url)) {
                found.push(url);
                foundThisNumber = true;
                break;
              }
            }
            if (foundThisNumber) break;
          }

          // Stop early if nothing found in the first 10 numbers
          if (i === 10 && found.length === 0) break;
        }

        return found;
      }

      // ============================================================
      // UI helpers
      // ============================================================
      function showStatus(html, isError = false) {
        viewer.classList.add('hidden');
        imageCounter.classList.add('hidden');
        statusMessage.classList.remove('hidden');
        statusMessage.className = 'status-message' + (isError ? ' error' : '');
        statusMessage.innerHTML = html;
      }

      function hideStatus() {
        statusMessage.classList.add('hidden');
        viewer.classList.remove('hidden');
        imageCounter.classList.remove('hidden');
      }

      function renderCurrent() {
        if (!imagePaths.length) return;
        if (currentIndex < 0) currentIndex = 0;
        if (currentIndex >= imagePaths.length) currentIndex = imagePaths.length - 1;

        imageStage.innerHTML = '';
        const img = document.createElement('img');
        img.src = imagePaths[currentIndex];
        img.alt = `Image ${currentIndex + 1} of ${imagePaths.length}`;
        imageStage.appendChild(img);

        imageCounter.textContent = `${currentIndex + 1} / ${imagePaths.length}`;
        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex === imagePaths.length - 1;
      }

      function goPrev() {
        if (currentIndex > 0) { currentIndex--; renderCurrent(); }
      }
      function goNext() {
        if (currentIndex < imagePaths.length - 1) { currentIndex++; renderCurrent(); }
      }

      // ============================================================
      // Init
      // ============================================================
      async function init() {
        const folder = getFolder();
        const basePath = getBasePath();
        folderBadge.textContent = folder;
        footerNote.textContent = `📂 ${basePath}/${folder}`;

        showStatus(`<i>⏳</i><div>Scanning folder <strong>/${folder}</strong>…</div>`);

        // Log everything for debugging — check browser console (F12)
        console.log('[Gallery] Base path:', basePath);
        console.log('[Gallery] Folder:', folder);
        console.log('[Gallery] Test URL:', `${basePath}/${folder}/1.jpg`);

        const images = await scanFolder(folder, basePath);
        imagePaths = images;

        console.log('[Gallery] Found', images.length, 'images:', images);

        if (images.length === 0) {
          showStatus(`
            <i>📭</i>
            <div style="font-size:1.2rem; font-weight:500;">No images found</div>
            <div style="font-size:0.9rem; opacity:0.85; max-width:450px;">
              Scanned: <code>${basePath}/${folder}/</code><br><br>
              Tried names like: <code>1.jpg</code>, <code>01.png</code>,
              <code>image1.jpg</code>, <code>img1.jpg</code>, <code>photo1.jpg</code>, <code>pic1.jpg</code>.<br><br>
              Your files must match one of these patterns (or open DevTools → Console to see the exact URLs checked).
            </div>
          `, true);
          return;
        }

        hideStatus();
        currentIndex = 0;
        renderCurrent();

        prevBtn.onclick = goPrev;
        nextBtn.onclick = goNext;
        window.onkeydown = (e) => {
          if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(); }
          else if (e.key === 'ArrowRight') { e.preventDefault(); goNext(); }
        };

        footerNote.textContent = `📂 ${basePath}/${folder} · ${images.length} image${images.length > 1 ? 's' : ''}`;
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
